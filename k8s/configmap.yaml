# ConfigMap holding the training hyperparameters. Mounted into the training
# Job at /app/configs so train.py reads it via CONFIG_PATH — decoupling config
# from the image (change hyperparameters without rebuilding).
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  labels:
    app: mlops-pipeline
    component: training
data:
  training_config.yaml: |
    model:
      architecture: resnet18
      num_classes: 10
    training:
      epochs: 10
      batch_size: 128
      learning_rate: 0.001
      early_stopping_patience: 3
      num_workers: 4
    data:
      dataset: cifar10
      data_dir: /app/data
    output:
      checkpoint_dir: /app/checkpoints
      model_name: classifier_v1.pt
