# HorizontalPodAutoscaler for the serving Deployment. Scales replicas 2->6
# based on CPU utilization. Requires metrics-server (enable in Minikube with:
# `minikube addons enable metrics-server`).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cifar10-serving-hpa
  labels:
    app: mlops-pipeline
    component: serving
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cifar10-serving
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
